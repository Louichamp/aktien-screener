<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Louichamp Screener · Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:    #0a0e14;
      --panel:  #111722;
      --panel2: #161d2b;
      --edge:   #222c3d;
      --muted:  #8b97a8;
      --text:   #e2e8f0;
      --accent: #38bdf8;
      --bear:   #ef4444;
      --gold-a: #fcd34d;
      --gold-b: #fbbf24;
      --gold-c: #d97706;
    }

    html, body {
      height: 100%;
      background: var(--ink);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Layout ─────────────────────────────────────────── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
    }

    /* ─── Card ───────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 20px 60px rgba(0,0,0,0.5);
    }

    /* ─── Logo ───────────────────────────────────────────── */
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-name {
      display: block;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--gold-a), var(--gold-b), var(--gold-c));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      display: block;
      margin-top: 0.25rem;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .logo-divider {
      margin: 1.5rem auto 0;
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--edge), transparent);
    }

    /* ─── Heading ────────────────────────────────────────── */
    .heading {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .lock-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: var(--panel2);
      border: 1px solid var(--edge);
      border-radius: 50%;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }
    .heading h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.3rem;
    }
    .heading p {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* ─── Form ───────────────────────────────────────────── */
    .field {
      margin-bottom: 1rem;
    }
    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap svg {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .field input {
      width: 100%;
      padding: 0.7rem 0.875rem 0.7rem 2.5rem;
      background: var(--panel2);
      border: 1px solid var(--edge);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }
    .field input::placeholder { color: var(--muted); opacity: 0.7; }

    /* ─── Button ─────────────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      border-radius: 8px;
      color: #0a0e14;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      position: relative;
    }
    .btn:hover:not(:disabled) { opacity: 0.92; }
    .btn:active:not(:disabled) { transform: scale(0.99); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Spinner inside button */
    .btn-spinner {
      display: none;
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      border: 2px solid rgba(10,14,20,0.3);
      border-top-color: #0a0e14;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    .btn.loading .btn-spinner { display: block; }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    /* ─── Error ──────────────────────────────────────────── */
    .error {
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.875rem;
      padding: 0.625rem 0.875rem;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 8px;
      font-size: 0.8rem;
      color: #f87171;
      animation: shake 0.35s ease;
    }
    .error.visible { display: flex; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-4px); }
      75%      { transform: translateX(4px); }
    }

    /* ─── Footer ─────────────────────────────────────────── */
    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.7rem;
      color: var(--edge);
    }

    /* ─── Responsive ─────────────────────────────────────── */
    @media (max-width: 440px) {
      .card { padding: 2rem 1.25rem; }
      .logo-name { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">

      <!-- Logo -->
      <div class="logo">
        <span class="logo-name">LOUICHAMP</span>
        <span class="logo-sub">Screener</span>
        <div class="logo-divider"></div>
      </div>

      <!-- Heading -->
      <div class="heading">
        <div class="lock-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1>Zugang</h1>
        <p>Bitte Passwort eingeben</p>
      </div>

      <!-- Form -->
      <form id="login-form" novalidate>
        <div class="field">
          <label for="password">Passwort</label>
          <div class="input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="16" r="1"></circle>
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="··········"
              autocomplete="current-password"
              autofocus
              required
            />
          </div>
        </div>

        <button type="submit" class="btn" id="submit-btn">
          Anmelden
          <span class="btn-spinner"></span>
        </button>

        <div class="error" id="error-msg">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
               style="flex-shrink:0">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="error-text">Falsches Passwort</span>
        </div>
      </form>

    </div>

    <div class="footer">Louichamp Screener &mdash; privater Zugang</div>
  </div>

  <script>
    (function () {
      const form   = document.getElementById("login-form");
      const btn    = document.getElementById("submit-btn");
      const pwdEl  = document.getElementById("password");
      const errBox = document.getElementById("error-msg");
      const errTxt = document.getElementById("error-text");

      // ?next= aus URL lesen — nur relative Pfade akzeptieren (Open-Redirect-Schutz)
      function getNext() {
        try {
          const raw = new URLSearchParams(location.search).get("next") || "/";
          // Ablehnen wenn nicht relativ (beginnt mit / aber nicht //)
          if (raw.startsWith("/") && !raw.startsWith("//")) return raw;
        } catch (_) {}
        return "/";
      }

      function setLoading(on) {
        btn.disabled = on;
        btn.classList.toggle("loading", on);
      }

      function showError(msg) {
        errTxt.textContent = msg;
        errBox.classList.remove("visible");
        // DOM-Reflow für Animation-Neustart
        void errBox.offsetWidth;
        errBox.classList.add("visible");
        pwdEl.value = "";
        pwdEl.focus();
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = pwdEl.value;
        if (!password) { pwdEl.focus(); return; }

        errBox.classList.remove("visible");
        setLoading(true);

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ password }),
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.ok) {
            // Kurz warten damit das Cookie gesetzt wird, dann weiterleiten
            btn.textContent = "Weiterleiten …";
            setTimeout(() => { location.href = getNext(); }, 80);
          } else {
            setLoading(false);
            showError(data.error || "Anmeldung fehlgeschlagen");
          }
        } catch (_) {
          setLoading(false);
          showError("Verbindungsfehler — bitte erneut versuchen");
        }
      });
    })();
  </script>
</body>
</html>
