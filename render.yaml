# ALTERNATIVER Deployment-Pfad (nicht der aktive): Render Blueprint für die
# FastAPI-Lese-Schicht. Der AKTIVE Pfad ist frontend/api/index.py + vercel.json
# (Backend läuft als Python Serverless Function direkt auf Vercel, same-origin
# mit dem Frontend, kein zweiter Account/keine Kreditkarten-Verifizierung
# nötig). Diese Datei bleibt als Option erhalten, falls später ein dauerhaft
# laufender Server ohne Serverless-Cold-Starts gewünscht ist.
#
# api/main.py macht KEINE Live-Berechnung — nur SELECT-Queries gegen die von
# compute_scores.py vorberechnete screener_rows-Tabelle. Kein Code-Change nötig,
# nur diese Deployment-Konfiguration.
#
# WICHTIG (Render Free Tier): braucht eine Kreditkarte zur Identitätsprüfung
# (temporäre $1-Autorisierung, keine Abbuchung laut Render) UND der Dyno
# schläft nach 15 Min. Inaktivität ein (~30-50s Cold-Start beim Aufwecken).

services:
  - type: web
    name: aktien-screener-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements-api.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false          # in Render-Dashboard setzen (Neon-Connection-String, s. Env-Var-Liste)
      - key: CORS_ORIGINS
        sync: false          # z.B. https://dein-projekt.vercel.app
      - key: SCREENER_CREATE_SCHEMA
        value: "false"        # Produktion: Schema via Alembic (compute-scores.yml), nicht Auto-Create
