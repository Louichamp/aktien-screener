name: Daily Screener Update

# Rotierender Auto-Update: frischt täglich die ältesten Werte neu auf, zeigt
# immer das gesamte angesammelte Universum (so viel wie geht) und deployt zu Netlify.
on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Wie viele älteste Werte auffrischen ('all' = komplett neu)"
        required: false
      limit:
        description: "Universumsgröße (leer = Repo-Variable / 5000)"
        required: false
      source:
        description: "sp500 oder broad (leer = Repo-Variable / broad)"
        required: false

concurrency:
  group: daily-update
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      DATABASE_URL: "sqlite+aiosqlite:///./ci.db"
      LIMIT: ${{ github.event.inputs.limit || vars.SCREENER_LIMIT || '5000' }}
      SOURCE: ${{ github.event.inputs.source || vars.SCREENER_SOURCE || 'broad' }}
      REFRESH: ${{ github.event.inputs.refresh || vars.SCREENER_REFRESH || '1500' }}
      YF_MAX_CONCURRENCY: "6"
      NEXT_PUBLIC_GOATCOUNTER: ${{ vars.GOATCOUNTER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy[asyncio]>=2.0" aiosqlite pydantic fastapi httpx lxml pandas yfinance

      - name: Rotating Sync
        run: python scripts/rotating_sync.py --cache .cache/snapshots.pkl --refresh "$REFRESH" --limit "$LIMIT" --source "$SOURCE" --passes 3

      - name: Export Static
        run: python scripts/export_static.py

      - name: Frontend Build
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Build Output Check
        run: |
          test -f frontend/out/index.html || { echo "::error::index fehlt"; exit 1; }
          test -f frontend/out/asset/index.html || { echo "::error::asset fehlt"; exit 1; }
          test -f frontend/out/data/screener.json || { echo "::error::data fehlt"; exit 1; }

      - name: Deploy Netlify
        run: npx --yes netlify-cli deploy --prod --dir=frontend/out --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}