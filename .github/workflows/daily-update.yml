name: Daily Screener Update (Netlify-Static-Pfad, DEAKTIVIERT)

# STILLGELEGT: Das Frontend wurde auf die Live-API-Architektur (Vercel + Render
# + Timescale Cloud) umgestellt — ScreenerApp.tsx/AssetView.tsx fetchen jetzt
# immer live von NEXT_PUBLIC_API_BASE statt aus frontend/public/data/*.json.
# `next build` erzeugt daher keinen validen frontend/out mehr; dieser Workflow
# würde am Safety-Gate scheitern. Cron bewusst auskommentiert (nicht gelöscht —
# reversibel per Revert), workflow_dispatch bleibt für manuellen Bedarf nutzbar.
# Aktiver Pfad jetzt: .github/workflows/compute-scores.yml

on:
  # schedule:
  #   - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Anzahl ältester Werte auffrischen ('all' = Komplett-Rebuild)"
        required: false
        default: "1500"
      limit:
        description: "Universumsgröße (leer = Repo-Variable / 5250)"
        required: false
      source:
        description: "sp500 oder broad (leer = Repo-Variable / broad)"
        required: false

concurrency:
  group: daily-update
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DATABASE_URL: "sqlite+aiosqlite:///./ci.db"
      LIMIT: ${{ github.event.inputs.limit || vars.SCREENER_LIMIT || '5250' }}
      SOURCE: ${{ github.event.inputs.source || vars.SCREENER_SOURCE || 'broad' }}
      REFRESH: ${{ github.event.inputs.refresh || vars.SCREENER_REFRESH || '1500' }}
      YF_MAX_CONCURRENCY: "10"
      YF_PERIOD: "1y"
      NEXT_PUBLIC_GOATCOUNTER: ${{ vars.GOATCOUNTER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Snapshot-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .cache
          key: snapshots-${{ github.run_id }}
          restore-keys: |
            snapshots-

      - name: Python-Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy[asyncio]>=2.0" aiosqlite pydantic fastapi httpx lxml pandas yfinance

      - name: Rotierender Sync (älteste zuerst) + Forecast
        run: |
          python scripts/rotating_sync.py \
            --cache .cache/snapshots.pkl \
            --refresh "$REFRESH" \
            --limit "$LIMIT" \
            --source "$SOURCE" \
            --passes 3

      - name: Export Static
        run: python scripts/export_static.py

      - name: Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Debug Build Output
        run: |
          pwd
          echo "===== frontend/out ====="
          ls -R frontend/out || true
          echo "===== find ====="
          find frontend/out -maxdepth 3 2>/dev/null | sort || true

      - name: Build-Output prüfen (Safety-Gate)
        run: |
          echo "=== Arbeitsverzeichnis ==="
          pwd

          echo ""
          echo "=== frontend/out Struktur ==="
          find frontend/out -maxdepth 3 2>/dev/null | sort || true

          echo ""
          echo "=== Safety-Gate ==="
          test -f frontend/out/index.html \
            || { echo "::error::frontend/out/index.html fehlt"; exit 1; }

          if [ -f frontend/out/asset/index.html ]; then
            echo "asset: index.html (ok)"
          elif [ -f frontend/out/asset.html ]; then
            echo "asset: flat html (ok)"
          else
            echo "::error::asset-Seite fehlt (weder asset/index.html noch asset.html)"
            exit 1
          fi

          test -f frontend/out/data/screener.json \
            || { echo "::error::frontend/out/data/screener.json fehlt"; exit 1; }
          python -c "import json,sys; d=json.load(open('frontend/out/data/screener.json')); n=len(d.get('items',[])); print(f'screener.json: {n} items'); sys.exit(0 if n>0 else 1)"

      - name: Deploy zu Netlify
        run: |
          npx --yes netlify-cli deploy \
            --prod \
            --dir=frontend/out \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
